<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://*.firebaseio.com https://*.firebasedatabase.app; frame-src https://*.firebaseio.com https://*.firebasedatabase.app; connect-src 'self' https: wss: http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'">
<title>피디들 방</title>
<link rel="stylesheet" href="style.css">
<style>
  .body { flex: 1; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; overflow: auto; }
  h2 { margin: 0; font-size: 18px; color: var(--lav-dd); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card {
    position: relative; background: #fff; border: 3px solid var(--lav-l); border-radius: 18px;
    padding: 8px 6px 10px; text-align: center; cursor: pointer; transition: transform .1s, border-color .15s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--lav); }
  .card.sel { border-color: var(--lav-d); background: var(--lav-l); }
  .card img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
  .row button { white-space: nowrap; }
  .card .nm { font-weight: 700; margin-top: 4px; }
  .card.sold img { filter: grayscale(.6) opacity(.7); }
  .stamp {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-14deg);
    border: 3px solid var(--red); color: var(--red); font-weight: 900; font-size: 22px; padding: 2px 10px;
    border-radius: 10px; background: rgba(255,255,255,.75); letter-spacing: 2px; pointer-events: none; white-space: nowrap;
  }
  .card .owner { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; min-height: 15px; }
  .code { font-size: 26px; font-weight: 900; letter-spacing: 6px; color: var(--lav-dd); }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .box { background: #fff; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--lav-l); }
  textarea { height: 170px; font-family: Consolas, monospace; font-size: 12px; }
  .pw { display: none; }
  .pw.show { display: flex; }
</style>
</head>
<body>
<div class="frame">
  <div class="titlebar">🏠 피디들 방 <span class="sp"></span><button id="close" title="닫기">✕</button></div>
  <div class="body" id="body"></div>
</div>
<script src="dist/setup.js"></script>
</body>
</html>
